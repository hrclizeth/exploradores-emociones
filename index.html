<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Guardián del Bosque Mágico | Salud Mental Infantil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2d936c;
      --primary-dark: #1f6b4e;
      --accent: #ff9f1c;
      --accent-dark: #d97706;
      --pink: #ff6b9d;
      --pink-dark: #d64575;
      --sky: #4cc9f0;
      --text: #1d3557;
      --card: #ffffff;
    }
    * { box-sizing: border-box; font-family: 'Nunito', 'Segoe UI', sans-serif; }
    h1, h2, h3, .badge-top, .main-btn, .share-btn { font-family: 'Fredoka', 'Segoe UI', sans-serif; }

    body {
      margin: 0; padding: 16px;
      background: linear-gradient(180deg, #a8e6ff 0%, #dff7e8 55%, #fff8d6 100%);
      color: var(--text); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden; position: relative;
    }

    /* Decoración flotante de fondo para hacerlo mágico */
    .bg-deco {
      position: fixed; font-size: 38px; opacity: 0.45; pointer-events: none; z-index: 0;
      animation: drift 8s infinite ease-in-out;
    }
    .deco-1 { top: 6%; left: 5%; animation-delay: 0s; }
    .deco-2 { top: 12%; right: 7%; animation-delay: 2s; }
    .deco-3 { bottom: 14%; left: 6%; animation-delay: 1s; font-size: 32px; }
    .deco-4 { bottom: 10%; right: 6%; animation-delay: 3s; font-size: 34px; }
    @keyframes drift { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(6deg); } }

    .game-box {
      max-width: 560px; width: 100%; background: var(--card); border-radius: 30px;
      padding: 24px 22px; box-shadow: 0 14px 35px rgba(29, 53, 87, 0.14);
      text-align: center; margin-top: 8px; position: relative; z-index: 1;
      border: 4px solid #ffffff;
      overflow: hidden;
    }
    .game-box::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 10px;
      background: linear-gradient(90deg, #ff6b9d, #ff9f1c, #ffd166, #2ec4b6, #4cc9f0);
    }

    .badge-top {
      display: inline-block; background: linear-gradient(135deg, #fff3cd, #ffe5ec);
      color: #b5179e; border: 2px solid #ffb3c6; padding: 6px 16px;
      border-radius: 50px; font-size: 0.88rem; font-weight: 600; margin-top: 6px;
      box-shadow: 0 3px 8px rgba(255, 107, 157, 0.15);
    }
    .subtitle-mental {
      font-size: 0.98rem; color: #2d936c; font-weight: 800; margin: 4px 0 10px 0;
      background: #e8f8f0; display: inline-block; padding: 5px 14px; border-radius: 14px;
    }

    .mascot { font-size: 72px; margin: 6px 0 2px 0; animation: bounce 2.4s infinite; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.1)); }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    h1 { font-size: 1.65rem; color: var(--primary); margin: 6px 0; line-height: 1.2; }

    p.story {
      font-size: 1.06rem; line-height: 1.5; background: #f3fbf7;
      padding: 14px; border-radius: 20px; border: 3px dashed #95d5b2; margin: 10px 0;
    }

    .author-tag {
      margin-top: 16px; font-size: 0.85rem; color: #4a5759;
      background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 14px;
      padding: 8px 12px; display: inline-block; font-weight: 700;
    }
    .author-tag span { color: var(--primary); }

    .progress-bar { display: flex; justify-content: center; gap: 12px; margin: 4px 0 6px 0; font-size: 1.6rem; }
